    <link href="css/index375x667.css" rel="stylesheet" type="text/css" />
    <script src="js/bootstrap.min.js" ></script>
    <script type="text/javascript" src="js/globals.js"></script>

    <script src="js/openSpeedtestShow.js"></script>
    <script src="js/openSpeedtestGet.js"></script>

    <script src="js/gsap.js"></script>

    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/icons/favicon-16x16.png">
    <link rel="manifest" href="assets/images/icons/site.webmanifest">

    <link rel="shortcut icon" href="assets/images/icons/favicon.ico">

  <body>
    <div class="container-fluid">
      <div class="row align-items-center justify-content-center min-vh-100">
        <div class="col-12 col-md-4 text-center order-2 order-md-1">
          <div class="circle-download">
            <div>DOWNLOAD</div>
            <div class="value" id="circle-download-value">0.000 G</div>
            <div class="mbps" id="circle-download-mbps">0.0 MB</div>
          </div>
        </div>
        <div class="col-12 col-md-4 text-center order-1 order-md-2">
          <div class="gigometer">
            <img src="assets/images/carrito.png" alt="Carrito" class="carrito">
          </div>
        </div>
        <div class="col-12 col-md-4 text-center order-3 order-md-3">
          <div class="circle-upload">
            <div>UPLOAD</div>
            <div class="value" id="circle-upload-value">0.000 G</div>
            <div class="mbps" id="circle-upload-mbps">0.0 MB</div>
          </div>
        </div>
      </div>
      <div class="row">
        <div class="col-12 text-center">
          <div class="boton-container">
            <button id="startButtonDesk" class="boton" onClick="start();">Start</button>
            <button id="secondButtonDesk" class="boton boton-secondary disabled" onClick="stopall()" disabled>Stop</button>
          </div>
        </div>
      </div>
    </div>
  
    <div class="arrow arrow-red"><div class="arrow-inner"></div></div>
    <div class="arrow arrow-green arrow-hidden"><div class="arrow-inner"></div></div>
    <div class="arrow arrow-blue arrow-hidden"><div class="arrow-inner"></div></div>
  
    <script type="text/javascript" src="js/tabla.js"></script>
  </body>
  
  
  
  
  

</html>
