	<!-- Relleno interior circulo speedometer (Donde aparecen las letras y numeros del speedTest) -->

  
<symbol id="mainGaugebg" viewBox="0 0 295.93 270.18">
  <path d="M64.32,256.41a137,137,0,1,1,192.09-24.8l-.07.09a134.45,134.45,0,0,1-24.71,24.71" />
</symbol>




			<!-- ES IGUAL QUE EL ANTERIOR PERO ESTO SE VISUALIZA UNA VEZ SE PRESIONE EL BOTON DE INICIAR pero este tiene un radio mayor que incluso puede tocar la mitad de la barra de progreso-->
	<symbol id="mainGaugeWhite" viewBox="0 0 295.93 270.18">
		<path fill="none" d="M64.32,256.41a137,137,0,1,1,192.09-24.8l-.07.09a134.45,134.45,0,0,1-24.71,24.71" />
	</symbol>
	<!-- LOS NUMEROS DE LOS VALORES EN LA BARRA DE PROGRESO -->
	<symbol id="oDoMeter" viewBox="0 0 295.93 270.18">
<!-- 		<text transform="translate(76.34 264.28) scale(0.9 1)">0Gb</text>
		<text transform="translate(23.81 164.6) scale(0.9 1)">0.8Gb</text>
		<text transform="translate(50.01 80.11) scale(0.9 1)">1Gb</text>
		<text transform="translate(140.58 36.04) scale(0.9 1)">5Gb</text>
		<text transform="translate(220.43 79.11) scale(0.9 1)">7Gb</text>
		<text transform="translate(240 164.6) scale(0.9 1)">8Gb</text> -->
		<text id="oDoTopSpeed" class="oDoTop-Speed" transform="translate(220.71 265.99) scale(0.9 1)">10Gb</text>
		<!-- Valor de velocidad que se visualiza en la parte central del valor del medidor, su valor es actualizado por la variable this.oDoLiveSpeed.el.textContent -->
		<text id="oDoLiveSpeed" class="oDoLive-Speed" transform="translate(150 150) scale(1 1)">...</text>
		<!-- Texto que se visualiza en la parde inferior del valor de velocidad, su valor es actualizado por la variable this.oDoLiveStatus.el.textContent -->
		<text id="oDoLiveStatus" class="oDoLive-Status" transform="translate(151 170) scale(1 1)"></text>
	</symbol>
